name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests
    # Apple silicon: macOS arm64 is the supported host, and most integration tests skip elsewhere.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up Node.js
        # Some tests run a real Node program as the Android device adapter; without it they skip.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install direnv
        run: brew install direnv
      - name: Create the scaffold runtime
        run: python -m venv --without-pip scripts/.venv
      - name: Run the tests
        working-directory: scripts
        run: .venv/bin/python -m tests.run_parallel
