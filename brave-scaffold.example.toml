# Copy to brave-scaffold.toml and replace the example Core path before use.
schema_version = 1

[logging]
# Print effective commands and their working directories by default.
commands = true

# Optional platform override. Omit to use the current host platform.
# [defaults]
# platform = "mac"
# Device id used when several Android devices are usable and --device is not given.
# android_device = "emulator-5554"

[[checkouts]]
# An alias names a checkout; it does not make it the default checkout.
alias = "main"
core = "/work/browser/_bad_scm/workspace/src/brave"
# Directory containing the .envrc that supplies this checkout's tool paths.
# Commands load it with direnv before running checkout tools.
# Relative to brave-scaffold.toml: this example loads environments/main/.envrc.
# `bdev env init` creates the file; you review it and run direnv allow.
direnv_dir = "environments/main"
