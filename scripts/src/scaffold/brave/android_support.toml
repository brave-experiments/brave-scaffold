# Where the Android-on-Mac support repository comes from. Compatibility with a
# checkout is not read from a table here: it is decided by the support
# repository's own version gates (copyMacRes.sh -v) run against that checkout.
[support]
url = "https://github.com/brave-experiments/brave-android-mac-support.git"
# Default for new working copies without --ref, and the required Android test branch.
# Test checks, repair commands, help, and overlay messages use this branch name.
default_ref = "android-testing-prototype"
